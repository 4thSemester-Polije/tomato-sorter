# Semua parameter proyek. Nilai null = BELUM DIUKUR, isi setelah kalibrasi.
serial:
  port: COM3            # Windows: COMx | Linux: /dev/ttyUSB0 | macOS: /dev/tty.usbserial-xxx
  baudrate: 115200
  timeout_s: 1.0

camera:
  index: 0
  width: 640
  height: 480
  flush_frames: 5       # buang frame lama dari buffer webcam sebelum mengambil gambar

capture:
  settle_after_detect_s: null   # jeda setelah DETECT agar tomat diam dan tangan menjauh, ukur dari alat

rubric:                 # lihat docs/RUBRIK.md
  red_ripe_min_pct: 60      # tingkat 1 bila merah >= nilai ini (acuan USDA)
  red_turning_min_pct: 10   # tingkat 2 bila merah >= nilai ini (acuan USDA)
  defect_light_max_pct: 10  # USULAN tim, bukan standar. Kalibrasi dari foto nyata

calibration:
  mm_per_pixel: null    # ukur dengan objek acuan pada jarak kamera tetap

timeouts_s:
  grade_wait: null      # batas firmware menunggu GRADE setelah DETECT (ERR GRADE_TIMEOUT)

paths:
  raw_images: data/raw
  background_image: data/raw/background.jpg
  photos_csv: data/photos.csv
  labels_csv: data/labels.csv
  features_csv: data/features.csv
  debug_dir: data/debug
  models_dir: models
