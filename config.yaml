# Semua parameter proyek. Nilai null = BELUM DIUKUR, isi setelah kalibrasi.
serial:
  port: COM3            # Windows: COMx | Linux: /dev/ttyUSB0 | macOS: /dev/tty.usbserial-xxx
  baudrate: 115200
  timeout_s: 1.0

camera:
  index: 0
  width: 640
  height: 480
  flush_frames: 5       # buang frame lama dari buffer webcam sebelum mengambil gambar

capture:
  settle_after_detect_s: 1.0.   # jeda setelah DETECT agar tomat diam dan tangan menjauh, ukur dari alat

rubric:                 # lihat docs/RUBRIK.md
  red_ripe_min_pct: 60      # tingkat 1 bila merah >= nilai ini (acuan USDA)
  red_turning_min_pct: 10   # tingkat 2 bila merah >= nilai ini (acuan USDA)
  defect_light_max_pct: 10  # USULAN tim, bukan standar. Kalibrasi dari foto nyata

calibration:
  mm_per_pixel: null    # ukur dengan objek acuan pada jarak kamera tetap

timeouts_s:
  grade_wait: null      # batas firmware menunggu GRADE setelah DETECT (ERR GRADE_TIMEOUT)

paths:
  raw_images: data/raw
  background_image: data/raw/background.jpg
  photos_csv: data/photos.csv
  labels_csv: data/labels.csv
  features_csv: data/features.csv
  debug_dir: data/debug
  models_dir: models

dashboard:                      # lihat dashboard/README.md
  host: 127.0.0.1               # 0.0.0.0 = bisa dibuka dari HP/PC lain di jaringan yang sama (tanpa login!)
  port: 8000
  url: http://127.0.0.1:8000    # alamat dashboard yang dipakai controller untuk mengirim data
  database: data/tomato.db
  stream_fps: 10                # batas kecepatan stream MJPEG ke browser
  max_frame_bytes: 2000000
  stale_after_s: 10             # status dianggap usang bila controller tidak memberi kabar selama ini
  history_page_size: 25
  throughput_window_min: 15
  chat:                         # kunci API: environment GEMINI_API_KEY (hanya di server)
    model: gemini-3.6-flash
    max_tokens: 1000
    max_tool_rounds: 5
    history_messages: 20
    max_per_minute: 20

ml:                             # opsional: controller memanggil ml/api.py (uvicorn ml.api:app) untuk klasifikasi gambar
  api_url: null                 # mis. http://127.0.0.1:9000 ; null = pakai ml/predict.py (fitur)
  architecture: null            # resnext50 | resnext101 | null (bawaan server)
  timeout_s: 10
